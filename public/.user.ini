; PHP runtime overrides for the public web root (PHP-FPM reads .user.ini per directory).
;
; Trademark logos uploaded as classifiers (type IMG) are stored in the
; `classifier.img` MEDIUMBLOB column. The application validates them up to 8 MB.
; PHP's default limits (upload_max_filesize=2M, post_max_size=8M) reject or
; silently drop larger multipart uploads, which surfaced to the user as an
; unexpected redirect to the login page. These values give enough headroom for
; the 8 MB application cap plus the rest of the multipart body.
upload_max_filesize = 12M
post_max_size = 16M
